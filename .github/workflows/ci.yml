name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regenerate results
        run: python code/fvl_verify.py

      - name: Check computed verdicts
        run: python code/check_results.py

      - name: Regenerate figures
        run: python code/regen_figures.py

      - name: Confirm figures were written
        run: |
          for n in 1 2 3 4 5 6 7 8 9; do
            test -s figures/fig${n}_*.png
          done
